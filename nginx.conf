server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.wasm$ {
        default_type application/wasm;
    }

    location ~* \.(js|css|json|woff2?|png|jpg|jpeg|svg|ico)$ {
        try_files $uri =404;
    }
}
